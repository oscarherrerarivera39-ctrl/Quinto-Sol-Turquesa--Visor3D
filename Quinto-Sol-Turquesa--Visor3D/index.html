<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="theme-color" content="#071211">
	<title>Visor 3D · Cubo</title>
	<style>
		:root {
			color-scheme: dark;
			--bg: #071211;
			--panel: rgba(15, 31, 29, .82);
			--line: rgba(177, 231, 219, .12);
			--text: #eaf5f1;
			--muted: #8ca49d;
			--accent: #55e0c1;
			--cube-color: #24bfa4;
			--size: 190px;
		}
		* { box-sizing: border-box; }
		body {
			min-height: 100vh;
			margin: 0;
			color: var(--text);
			font: 14px/1.5 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
			background: radial-gradient(ellipse at 50% 45%, #12332d 0, #0b1c19 36%, var(--bg) 75%);
		}
		button, input { font: inherit; }
		.app { min-height: 100vh; display: grid; grid-template-rows: auto 1fr auto; padding: 26px clamp(18px, 5vw, 72px) 20px; }
		header { display: flex; align-items: center; justify-content: space-between; gap: 20px; }
		.brand { display: flex; align-items: center; gap: 12px; font-size: 15px; font-weight: 650; letter-spacing: .02em; }
		.brand-mark { width: 34px; height: 34px; display: grid; place-items: center; border: 1px solid rgba(85,224,193,.38); border-radius: 11px; color: var(--accent); background: rgba(85,224,193,.08); }
		.brand-mark svg { width: 19px; }
		.top-note { color: var(--muted); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
		main { width: min(1050px, 100%); margin: auto; display: grid; grid-template-columns: minmax(0, 1fr) 270px; align-items: center; gap: clamp(32px, 8vw, 100px); padding: 46px 0; }
		.stage { min-height: 510px; position: relative; display: grid; place-items: center; overflow: hidden; border: 1px solid var(--line); border-radius: 24px; background: radial-gradient(ellipse at center, rgba(38,101,87,.18), rgba(7,18,17,.14) 58%, rgba(7,18,17,.38)); }
		.stage::before { content: ""; position: absolute; width: min(70%, 410px); aspect-ratio: 1; border: 1px solid rgba(157,226,209,.07); border-radius: 50%; }
		.stage::after { content: ""; position: absolute; left: 12%; right: 12%; top: 50%; height: 1px; background: linear-gradient(90deg, transparent, rgba(157,226,209,.08), transparent); }
		.scene { width: 100%; height: 100%; min-height: 510px; display: grid; place-items: center; perspective: 900px; perspective-origin: 50% 45%; touch-action: none; cursor: grab; }
		.scene:active { cursor: grabbing; }
		.cube { position: relative; width: var(--size); height: var(--size); transform-style: preserve-3d; transform: rotateX(-24deg) rotateY(-34deg); transition: transform .12s linear; }
		.face { position: absolute; inset: 0; display: grid; place-items: center; border: 1px solid rgba(209,255,245,.56); background: color-mix(in srgb, var(--cube-color) 76%, transparent); box-shadow: inset 0 0 38px rgba(255,255,255,.08); backface-visibility: visible; }
		.face::after { content: ""; width: 40%; height: 40%; border: 1px solid rgba(230,255,249,.42); border-radius: 4px; opacity: .58; }
		.front { transform: translateZ(calc(var(--size) / 2)); background-color: color-mix(in srgb, var(--cube-color) 78%, #b8ffec 22%); }
		.back { transform: rotateY(180deg) translateZ(calc(var(--size) / 2)); filter: brightness(.58); }
		.right { transform: rotateY(90deg) translateZ(calc(var(--size) / 2)); filter: brightness(.78); }
		.left { transform: rotateY(-90deg) translateZ(calc(var(--size) / 2)); filter: brightness(.5); }
		.top { transform: rotateX(90deg) translateZ(calc(var(--size) / 2)); filter: brightness(1.2); }
		.bottom { transform: rotateX(-90deg) translateZ(calc(var(--size) / 2)); filter: brightness(.42); }
		.shadow { position: absolute; width: 235px; height: 44px; margin-top: 250px; border-radius: 50%; background: rgba(0,0,0,.42); filter: blur(20px); transform: rotateX(65deg); }
		.stage-label { position: absolute; z-index: 1; left: 22px; top: 20px; display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; }
		.live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 12px var(--accent); }
		.hint { position: absolute; z-index: 1; bottom: 20px; color: #76908a; font-size: 12px; }
		.panel { padding: 24px; border: 1px solid var(--line); border-radius: 20px; background: var(--panel); box-shadow: 0 20px 70px rgba(0,0,0,.18); backdrop-filter: blur(18px); }
		.eyebrow { margin: 0 0 8px; color: var(--accent); font-size: 10px; font-weight: 700; letter-spacing: .15em; text-transform: uppercase; }
		h1 { margin: 0; font-size: 24px; letter-spacing: -.04em; }
		.description { margin: 7px 0 24px; color: var(--muted); font-size: 12px; }
		.section-title { display: flex; justify-content: space-between; align-items: center; margin-bottom: 11px; font-size: 12px; font-weight: 600; }
		.value { color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 450; }
		.control { margin: 20px 0; }
		input[type="range"] { display: block; width: 100%; height: 4px; margin: 14px 0 0; accent-color: var(--accent); cursor: pointer; }
		.swatches { display: flex; gap: 10px; }
		.swatch { width: 26px; height: 26px; padding: 0; border: 2px solid transparent; border-radius: 50%; cursor: pointer; transition: transform .15s, border-color .15s; }
		.swatch:hover { transform: scale(1.12); }
		.swatch.active { border-color: #e6fff7; box-shadow: 0 0 0 2px #172a26; }
		.swatch[data-color="#24bfa4"] { background: #24bfa4; }
		.swatch[data-color="#6c8cff"] { background: #6c8cff; }
		.swatch[data-color="#bf7af2"] { background: #bf7af2; }
		.swatch[data-color="#f0a45b"] { background: #f0a45b; }
		.divider { height: 1px; margin: 20px 0; background: var(--line); }
		.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
		.btn { min-height: 40px; display: flex; justify-content: center; align-items: center; gap: 7px; padding: 0 12px; color: var(--text); border: 1px solid var(--line); border-radius: 10px; background: rgba(255,255,255,.035); cursor: pointer; transition: .18s ease; }
		.btn:hover { border-color: rgba(85,224,193,.42); background: rgba(85,224,193,.08); }
		.btn.primary { color: #06201a; border-color: var(--accent); background: var(--accent); font-weight: 700; }
		.btn.primary:hover { background: #82efd6; }
		.btn svg { width: 15px; height: 15px; }
		.readout { display: flex; justify-content: space-between; color: var(--muted); font-size: 11px; }
		.readout strong { color: #cce4dc; font-weight: 500; font-variant-numeric: tabular-nums; }
		footer { display: flex; justify-content: space-between; color: #617872; font-size: 11px; }
		.keyboard { color: #829b94; }
		kbd { padding: 2px 6px; border: 1px solid var(--line); border-radius: 5px; background: rgba(255,255,255,.035); font: inherit; }
		@media (max-width: 760px) {
			.app { padding: 18px 16px 14px; }
			.top-note { display: none; }
			main { grid-template-columns: 1fr; gap: 18px; padding: 25px 0; }
			.stage, .scene { min-height: 390px; }
			.panel { padding: 20px; }
			.description { margin-bottom: 18px; }
			.control { margin: 16px 0; }
			footer { gap: 12px; }
			.keyboard { display: none; }
		}
		@media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; } }
	</style>
</head>
<body>
	<div class="app">
		<header>
			<div class="brand"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="m12 2.8 8.2 4.6v9.2L12 21.2l-8.2-4.6V7.4L12 2.8Z" stroke="currentColor" stroke-width="1.5"/><path d="m3.9 7.5 8.1 4.6 8.1-4.6M12 12.1v9" stroke="currentColor" stroke-width="1.5"/></svg></span> Quinto Sol <span style="color:var(--muted);font-weight:400">/ Visor 3D</span></div>
			<div class="top-note">Laboratorio visual · 01</div>
		</header>

		<main>
			<section class="stage" aria-label="Vista interactiva del cubo">
				<div class="stage-label"><span class="live-dot"></span> Vista en tiempo real</div>
				<div class="scene" id="scene" aria-label="Arrastra para rotar el cubo">
					<div class="shadow"></div>
					<div class="cube" id="cube" role="img" aria-label="Cubo tridimensional turquesa">
						<div class="face front"></div><div class="face back"></div>
						<div class="face right"></div><div class="face left"></div>
						<div class="face top"></div><div class="face bottom"></div>
					</div>
				</div>
				<div class="hint">Arrastra para explorar el objeto</div>
			</section>

			<aside class="panel">
				<p class="eyebrow">Objeto 01</p>
				<h1>Cubo 3D</h1>
				<p class="description">Personaliza la vista y explora sus dimensiones.</p>

				<div class="control">
					<div class="section-title"><label for="size">Tamaño</label><span class="value" id="sizeValue">190 px</span></div>
					<input id="size" type="range" min="120" max="250" value="190" aria-label="Tamaño del cubo">
				</div>
				<div class="control">
					<div class="section-title"><label for="speed">Velocidad</label><span class="value" id="speedValue">1.0×</span></div>
					<input id="speed" type="range" min="0" max="30" value="10" aria-label="Velocidad de rotación">
				</div>
				<div class="control">
					<div class="section-title">Color</div>
					<div class="swatches" role="group" aria-label="Color del cubo">
						<button class="swatch active" data-color="#24bfa4" aria-label="Turquesa" aria-pressed="true"></button>
						<button class="swatch" data-color="#6c8cff" aria-label="Azul" aria-pressed="false"></button>
						<button class="swatch" data-color="#bf7af2" aria-label="Violeta" aria-pressed="false"></button>
						<button class="swatch" data-color="#f0a45b" aria-label="Naranja" aria-pressed="false"></button>
					</div>
				</div>
				<div class="divider"></div>
				<div class="actions">
					<button class="btn primary" id="playBtn" aria-pressed="true"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg><span>Animar</span></button>
					<button class="btn" id="resetBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 12a9 9 0 1 0 2.6-6.4L3 8"/><path d="M3 3v5h5"/></svg>Restablecer</button>
				</div>
				<div class="divider"></div>
				<div class="readout"><span>Rotación</span><strong id="rotationReadout">X −24° &nbsp; Y −34°</strong></div>
			</aside>
		</main>

		<footer><span>Visor interactivo <span style="color:var(--accent)">●</span> Render CSS</span><span class="keyboard"><kbd>Arrastrar</kbd> rotar &nbsp; <kbd>Espacio</kbd> animar</span></footer>
	</div>

	<script>
		(() => {
			const cube = document.getElementById('cube');
			const scene = document.getElementById('scene');
			const size = document.getElementById('size');
			const speed = document.getElementById('speed');
			const playBtn = document.getElementById('playBtn');
			const rotationReadout = document.getElementById('rotationReadout');
			let rx = -24, ry = -34, dragging = false, previousX = 0, previousY = 0;
			let running = true, speedFactor = 1, lastTime = 0;

			function render() {
				cube.style.transform = `rotateX(${rx}deg) rotateY(${ry}deg)`;
				const x = Math.round(((rx % 360) + 360) % 360);
				const y = Math.round(((ry % 360) + 360) % 360);
				rotationReadout.textContent = `X ${x}°  ·  Y ${y}°`;
			}
			function animate(time) {
				if (running && !dragging && lastTime) ry += (time - lastTime) * .012 * speedFactor;
				lastTime = time;
				if (running && !dragging) render();
				requestAnimationFrame(animate);
			}
			requestAnimationFrame(animate);

			size.addEventListener('input', () => {
				document.documentElement.style.setProperty('--size', `${size.value}px`);
				document.getElementById('sizeValue').textContent = `${size.value} px`;
			});
			speed.addEventListener('input', () => {
				speedFactor = Number(speed.value) / 10;
				document.getElementById('speedValue').textContent = `${speedFactor.toFixed(1)}×`;
			});
			document.querySelectorAll('.swatch').forEach(button => button.addEventListener('click', () => {
				document.documentElement.style.setProperty('--cube-color', button.dataset.color);
				document.querySelectorAll('.swatch').forEach(item => {
					const active = item === button;
					item.classList.toggle('active', active);
					item.setAttribute('aria-pressed', String(active));
				});
			}));
			function toggleAnimation() {
				running = !running;
				playBtn.setAttribute('aria-pressed', String(running));
				playBtn.querySelector('span').textContent = running ? 'Pausar' : 'Animar';
				playBtn.querySelector('svg').innerHTML = running ? '<path d="M7 5h4v14H7zm6 0h4v14h-4z"/>' : '<path d="M8 5v14l11-7z"/>';
			}
			playBtn.addEventListener('click', toggleAnimation);
			document.getElementById('resetBtn').addEventListener('click', () => {
				rx = -24; ry = -34; size.value = 190; speed.value = 10; speedFactor = 1;
				document.documentElement.style.setProperty('--size', '190px');
				document.getElementById('sizeValue').textContent = '190 px';
				document.getElementById('speedValue').textContent = '1.0×';
				document.documentElement.style.setProperty('--cube-color', '#24bfa4');
				document.querySelectorAll('.swatch').forEach((item, index) => {
					item.classList.toggle('active', index === 0);
					item.setAttribute('aria-pressed', String(index === 0));
				});
				if (!running) toggleAnimation();
				render();
			});
			scene.addEventListener('pointerdown', event => {
				dragging = true; previousX = event.clientX; previousY = event.clientY;
				scene.setPointerCapture(event.pointerId);
			});
			scene.addEventListener('pointermove', event => {
				if (!dragging) return;
				ry += (event.clientX - previousX) * .65;
				rx -= (event.clientY - previousY) * .65;
				previousX = event.clientX; previousY = event.clientY; render();
			});
			scene.addEventListener('pointerup', () => { dragging = false; });
			scene.addEventListener('pointercancel', () => { dragging = false; });
			document.addEventListener('keydown', event => {
				if (event.code === 'Space' && !/INPUT|BUTTON/.test(document.activeElement.tagName)) {
					event.preventDefault(); toggleAnimation();
				}
			});
		})();
	</script>
</body>
</html>
