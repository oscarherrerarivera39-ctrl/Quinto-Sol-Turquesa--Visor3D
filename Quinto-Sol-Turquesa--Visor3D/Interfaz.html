<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Triángulo 3D</title>
  <style>
    :root {
      --bg1: #061726;
      --bg2: #0c2f3f;
      --fg: #dffbff;
      --accent: #54d7ff;
      --accent2: #8ef0d8;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: radial-gradient(circle at top, var(--bg2), var(--bg1) 60%);
      color: var(--fg);
      overflow: hidden;
    }

    body {
      display: grid;
      place-items: center;
    }

    .panel {
      position: relative;
      width: min(90vw, 900px);
      height: min(80vh, 700px);
      border-radius: 24px;
      background: rgba(9, 28, 36, 0.45);
      border: 1px solid rgba(148, 228, 255, 0.2);
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4), inset 0 0 30px rgba(84, 215, 255, 0.12);
      backdrop-filter: blur(8px);
      overflow: hidden;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      background: transparent;
    }

    .titulo {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      font-size: clamp(22px, 3vw, 34px);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(223, 251, 255, 0.9);
      text-shadow: 0 0 18px rgba(84, 215, 255, 0.8);
      user-select: none;
    }
  </style>
</head>
<body>
  <div class="panel">
    <div class="titulo">Triángulo 3D</div>
    <canvas id="scene"></canvas>
  </div>

  <script>
    const canvas = document.getElementById('scene');
    const ctx = canvas.getContext('2d');

    let w = 0;
    let h = 0;
    let rotationY = 0;
    let rotationX = -0.8;

    function resize() {
      const panel = canvas.parentElement;
      const rect = panel.getBoundingClientRect();
      const ratio = window.devicePixelRatio || 1;
      w = rect.width;
      h = rect.height;
      canvas.width = w * ratio;
      canvas.height = h * ratio;
      ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
    }

    function project(point, cx, cy, scale) {
      const cameraZ = 550;
      const perspective = cameraZ / (cameraZ - point.z);
      return {
        x: cx + point.x * perspective * scale,
        y: cy + point.y * perspective * scale,
        z: point.z,
        perspective
      };
    }

    function rotateX(point, angle) {
      const cos = Math.cos(angle);
      const sin = Math.sin(angle);
      return {
        x: point.x,
        y: point.y * cos - point.z * sin,
        z: point.y * sin + point.z * cos
      };
    }

    function rotateY(point, angle) {
      const cos = Math.cos(angle);
      const sin = Math.sin(angle);
      return {
        x: point.x * cos + point.z * sin,
        y: point.y,
        z: -point.x * sin + point.z * cos
      };
    }

    function drawFace(points, color, alpha = 1) {
      ctx.beginPath();
      ctx.moveTo(points[0].x, points[0].y);
      for (let i = 1; i < points.length; i++) {
        ctx.lineTo(points[i].x, points[i].y);
      }
      ctx.closePath();
      ctx.fillStyle = color.replace(')', `, ${alpha})`).replace('rgb', 'rgba');
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.2)';
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }

    function drawTriangle3D(time) {
      ctx.clearRect(0, 0, w, h);

      const cx = w / 2;
      const cy = h / 2 + 30;
      const scale = Math.min(w, h) * 0.18;

      const vertices = [
        { x: -120, y: 80, z: 20 },
        { x: 120, y: 80, z: 20 },
        { x: 0, y: -120, z: 20 },
        { x: 0, y: 0, z: -160 }
      ];

      const rotated = vertices.map(p => {
        let r = rotateY(p, rotationY);
        r = rotateX(r, rotationX);
        return r;
      });

      const projected = rotated.map(p => project(p, cx, cy, scale));

      const faces = [
        [projected[0], projected[1], projected[2]],
        [projected[0], projected[1], projected[3]],
        [projected[1], projected[2], projected[3]],
        [projected[2], projected[0], projected[3]]
      ];

      const shades = [
        'rgb(84, 215, 255)',
        'rgb(142, 240, 216)',
        'rgb(80, 140, 255)',
        'rgb(123, 110, 255)'
      ];

      faces.forEach((face, index) => {
        const avgZ = face.reduce((sum, p) => sum + p.z, 0) / face.length;
        const alpha = 0.4 + (avgZ + 180) / 500;
        const color = shades[index % shades.length];
        drawFace(face, color, Math.min(0.9, Math.max(0.25, alpha)));
      });

      ctx.beginPath();
      ctx.moveTo(projected[0].x, projected[0].y);
      ctx.lineTo(projected[1].x, projected[1].y);
      ctx.lineTo(projected[2].x, projected[2].y);
      ctx.closePath();
      ctx.strokeStyle = 'rgba(255,255,255,0.8)';
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(projected[0].x, projected[0].y);
      ctx.lineTo(projected[3].x, projected[3].y);
      ctx.lineTo(projected[1].x, projected[1].y);
      ctx.moveTo(projected[1].x, projected[1].y);
      ctx.lineTo(projected[2].x, projected[2].y);
      ctx.lineTo(projected[3].x, projected[3].y);
      ctx.moveTo(projected[2].x, projected[2].y);
      ctx.lineTo(projected[0].x, projected[0].y);
      ctx.strokeStyle = 'rgba(255,255,255,0.5)';
      ctx.stroke();

      const glow = 8 + Math.sin(time * 0.005) * 4;
      ctx.beginPath();
      ctx.arc(projected[3].x, projected[3].y, glow, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(142, 240, 216, 0.35)';
      ctx.fill();
    }

    function animate(ts) {
      rotationY += 0.012;
      drawTriangle3D(ts);
      requestAnimationFrame(animate);
    }

    resize();
    requestAnimationFrame(animate);
    window.addEventListener('resize', resize);
  </script>
</body>
</html>
