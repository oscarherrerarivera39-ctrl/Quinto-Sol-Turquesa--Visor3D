<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Oruga 3D</title>
    <style>
      :root {
        --bg1: #06131d;
        --bg2: #0f2233;
        --bg3: #1e4f6b;
        --green1: #c7f05d;
        --green2: #8ad95e;
        --green3: #4a9d5d;
        --green4: #2c7a6a;
        --dark: #112b1d;
        --shell: #f8efdc;
        --shadow: rgba(0, 0, 0, 0.35);
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        height: 100%;
        font-family: Arial, Helvetica, sans-serif;
        background:
          radial-gradient(circle at 20% 10%, rgba(96, 211, 255, 0.18), transparent 30%),
          radial-gradient(circle at 80% 20%, rgba(69, 255, 181, 0.18), transparent 26%),
          linear-gradient(180deg, var(--bg1) 0%, var(--bg2) 35%, var(--bg3) 100%);
        overflow: hidden;
      }

      body {
        display: grid;
        place-items: center;
      }

      .scene {
        position: relative;
        width: min(88vw, 920px);
        height: min(80vh, 560px);
        display: grid;
        place-items: center;
        perspective: 1400px;
      }

      .shadow {
        position: absolute;
        width: 540px;
        height: 120px;
        background: radial-gradient(ellipse at center, rgba(0,0,0,0.5), rgba(0,0,0,0) 70%);
        filter: blur(10px);
        bottom: 48px;
        transform: rotateX(80deg) translateZ(-120px);
        animation: shadowPulse 4s ease-in-out infinite;
      }

      .oruga {
        position: relative;
        width: 620px;
        height: 260px;
        transform-style: preserve-3d;
        animation: bob 4s ease-in-out infinite;
      }

      .segment, .head {
        position: absolute;
        left: 50%;
        top: 50%;
        transform-style: preserve-3d;
      }

      .segment {
        width: 90px;
        height: 78px;
        border-radius: 48% 52% 56% 44% / 52% 49% 51% 48%;
        background: linear-gradient(135deg, var(--green1), var(--green2) 26%, var(--green3) 65%, var(--green4));
        border: 3px solid rgba(14, 36, 18, 0.48);
        box-shadow:
          inset -12px -10px 15px rgba(17, 43, 29, 0.28),
          inset 10px 12px 18px rgba(255, 255, 255, 0.25),
          0 18px 25px rgba(0, 0, 0, 0.25);
      }

      .segment::before,
      .segment::after {
        content: "";
        position: absolute;
        inset: 10px 14px 10px 14px;
        border-radius: 50%;
        border: 2px solid rgba(255,255,255,0.18);
        transform: rotateX(60deg) rotateY(-18deg);
      }

      .segment::after {
        inset: 18px 18px 18px 18px;
        border-color: rgba(11, 60, 38, 0.25);
        transform: rotateX(-70deg) rotateY(30deg);
      }

      .head {
        width: 110px;
        height: 92px;
        margin-left: 245px;
        margin-top: -8px;
        background: linear-gradient(140deg, #d9ff8e 0%, #b0eb62 28%, #6bbd6d 68%, #3c8d60 100%);
        border-radius: 44% 56% 52% 48% / 55% 46% 54% 45%;
        border: 3px solid rgba(14, 36, 18, 0.5);
        box-shadow:
          inset -12px -8px 14px rgba(15, 44, 20, 0.25),
          inset 8px 12px 18px rgba(255,255,255,0.25),
          0 20px 30px rgba(0,0,0,0.25);
        transform: translate3d(160px, 0, 50px) rotateY(16deg) rotateZ(8deg);
      }

      .head::before {
        content: "";
        position: absolute;
        width: 26px;
        height: 26px;
        border-radius: 50%;
        background: rgba(255,255,255,0.15);
        right: 18px;
        top: 12px;
        box-shadow: -36px 8px 0 rgba(255,255,255,0.08);
      }

      .eye {
        position: absolute;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: #111;
        top: 26px;
        box-shadow: inset 0 0 0 4px #fff;
        animation: blink 6s infinite ease-in-out;
      }

      .eye.left { left: 20px; }
      .eye.right { left: 52px; }

      .antenna {
        position: absolute;
        width: 3px;
        height: 38px;
        background: linear-gradient(180deg, #2d3a2d, #132712);
        top: -30px;
        border-radius: 999px;
      }

      .antenna.left { left: 23px; transform: rotate(-18deg); }
      .antenna.right { left: 66px; transform: rotate(18deg); }

      .antenna::before {
        content: "";
        position: absolute;
        width: 12px;
        height: 12px;
        background: #ffca7a;
        border-radius: 50%;
        left: 50%;
        top: -8px;
        transform: translateX(-50%);
        box-shadow: 0 0 10px rgba(255, 202, 122, 0.9);
      }

      .mouth {
        position: absolute;
        width: 28px;
        height: 12px;
        border: 3px solid rgba(72, 33, 17, 0.8);
        border-top: 0;
        border-radius: 0 0 16px 16px;
        bottom: 16px;
        left: 36px;
        transform: rotate(-2deg);
      }

      .leg {
        position: absolute;
        width: 46px;
        height: 18px;
        border: 3px solid rgba(27, 46, 30, 0.9);
        border-top: 0;
        border-radius: 0 0 14px 14px;
        bottom: -16px;
        opacity: 0.88;
      }

      .leg.l1 { left: 14px; transform: rotate(12deg); }
      .leg.l2 { left: 42px; transform: rotate(-12deg); }
      .leg.l3 { left: 66px; transform: rotate(12deg); }

      .spark {
        position: absolute;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(255,255,255,0.95), rgba(255,255,255,0.15) 60%, transparent 72%);
        box-shadow: 0 0 18px rgba(255,255,255,0.6);
        animation: glow 3s ease-in-out infinite alternate;
      }

      .spark.s1 { left: 82px; top: 83px; }
      .spark.s2 { left: 146px; top: 140px; }
      .spark.s3 { left: 210px; top: 90px; }
      .spark.s4 { left: 320px; top: 118px; }
      .spark.s5 { left: 388px; top: 170px; }

      @keyframes bob {
        0%, 100% { transform: rotateX(12deg) rotateY(-18deg) translateY(0); }
        50% { transform: rotateX(-8deg) rotateY(18deg) translateY(-18px); }
      }

      @keyframes shadowPulse {
        0%, 100% { transform: scaleX(1) rotateX(80deg) translateZ(-120px); opacity: 0.6; }
        50% { transform: scaleX(0.95) rotateX(80deg) translateZ(-120px); opacity: 0.95; }
      }

      @keyframes blink {
        0%, 44%, 48%, 100% { transform: scaleY(1); }
        46% { transform: scaleY(0.12); }
      }

      @keyframes glow {
        0% { opacity: 0.2; transform: scale(0.7); }
        100% { opacity: 1; transform: scale(1.2); }
      }

      @media (max-width: 700px) {
        .scene {
          transform: scale(0.72);
        }
      }
    </style>
  </head>
  <body>
    <div class="scene">
      <div class="shadow"></div>
      <div class="oruga" aria-label="Oruga 3D">
        <div class="spark s1"></div>
        <div class="spark s2"></div>
        <div class="spark s3"></div>
        <div class="spark s4"></div>
        <div class="spark s5"></div>
      </div>
    </div>

    <script>
      const oruga = document.querySelector('.oruga');
      const colors = [
        ['#d5ff7b', '#a9e96a', '#69be67', '#3d9368'],
        ['#d1ff83', '#b6ee6d', '#6ec16d', '#3f8167'],
        ['#dcff9d', '#bfe95d', '#7bcf6e', '#3d8c67'],
        ['#d7ff88', '#aee86d', '#6bbd69', '#397b63'],
        ['#dff9ac', '#bde77a', '#76c96f', '#3d8d61'],
        ['#d4ff8f', '#b2eb67', '#68be68', '#407f6b'],
        ['#d7ff8d', '#aae76d', '#62ae6e', '#3b7b61'],
        ['#d8ff96', '#c0ee6d', '#78ca68', '#447e64']
      ];

      for (let i = 0; i < 8; i++) {
        const seg = document.createElement('div');
        seg.className = 'segment';
        const offset = (i - 3.5) * 62;
        const y = Math.sin(i * 0.85) * 24;
        const z = (i - 3.5) * 18;
        const rotY = (i - 3.5) * 12;
        const rotZ = i % 2 === 0 ? 18 : -18;
        seg.style.transform = `translate3d(${offset}px, ${y}px, ${z}px) rotateY(${rotY}deg) rotateZ(${rotZ}deg)`;
        seg.style.background = `linear-gradient(135deg, ${colors[i][0]}, ${colors[i][1]} 26%, ${colors[i][2]} 65%, ${colors[i][3]})`;
        seg.style.zIndex = String(8 - i);
        oruga.appendChild(seg);
      }

      const head = document.createElement('div');
      head.className = 'head';

      const eyeL = document.createElement('span');
      eyeL.className = 'eye left';
      const eyeR = document.createElement('span');
      eyeR.className = 'eye right';

      const antL = document.createElement('span');
      antL.className = 'antenna left';
      const antR = document.createElement('span');
      antR.className = 'antenna right';

      const mouth = document.createElement('span');
      mouth.className = 'mouth';

      const leg1 = document.createElement('span');
      leg1.className = 'leg l1';
      const leg2 = document.createElement('span');
      leg2.className = 'leg l2';
      const leg3 = document.createElement('span');
      leg3.className = 'leg l3';

      head.append(antL, antR, eyeL, eyeR, mouth, leg1, leg2, leg3);
      oruga.appendChild(head);

      document.addEventListener('pointermove', (event) => {
        const x = (event.clientX / window.innerWidth - 0.5) * 30;
        const y = (event.clientY / window.innerHeight - 0.5) * 30;
        oruga.style.transform = `rotateX(${(-y).toFixed(2)}deg) rotateY(${(x).toFixed(2)}deg)`;
      });
    </script>
  </body>
</html>
